name: Pre Merge Checks

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - '*'

jobs:
  gradle:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, 'ci skip') }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check formatting and assemble
        run: >-
          ./gradlew spotlessCheck --continue
          :uikit-core:assemble :uikit-components:assemble :uikit-components-foundation:assemble

      - name: Test (JVM)
        run: ./gradlew :uikit-core:jvmTest

      # Both flavors compare against the same goldens in sample/src/test/snapshots.
      - name: Verify screenshots (Material3 backend)
        run: ./gradlew :sample:verifyRoborazziMaterial3Debug

      - name: Verify screenshots (foundation backend)
        if: always()
        run: ./gradlew :sample:verifyRoborazziFoundationDebug

      - name: Upload Gradle Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/
            sample/build/outputs/roborazzi/
          if-no-files-found: warn

  ios:
    runs-on: macos-latest
    if: ${{ !contains(github.event.head_commit.message, 'ci skip') }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile iOS and run iOS tests
        run: >-
          ./gradlew
          :uikit-core:iosSimulatorArm64Test
          :uikit-components:compileKotlinIosSimulatorArm64
          :uikit-components-foundation:compileKotlinIosSimulatorArm64
